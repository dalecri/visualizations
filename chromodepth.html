<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMODEPTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#14101C; --surface:#2A2233; --surface-2:#251F2D; --line:#3D3448;
    --muted:#9B8FA8; --text:#EDE8F5; --moon:#B9A9D9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--page); color:var(--text);
    font:12px/1.4 'Space Mono',ui-monospace,Menlo,monospace;
    min-height:100dvh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{
    width:100%; max-width:1232px; margin:0 auto; padding:14px 16px 12px;
    display:flex; flex-wrap:wrap; align-items:center; gap:8px 6px;
  }
  h1{
    margin:0 auto 0 0; font-size:13px; font-weight:700; letter-spacing:.22em; white-space:nowrap;
    padding-right:10px;
  }
  h1 .r{color:#FF2A36} h1 .b{color:#4A6BFF}
  .grp{display:inline-flex; align-items:center; gap:4px}
  button,select,input[type=text]{
    font:inherit; color:var(--text); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; height:30px; padding:0 8px;
    transition:background .15s, border-color .15s, color .15s;
  }
  button{cursor:pointer; white-space:nowrap}
  button:hover,select:hover{background:var(--surface)}
  button:active{transform:translateY(1px)}
  :focus-visible{outline:2px solid var(--moon); outline-offset:2px}
  select{cursor:pointer; padding-right:6px}
  input[type=text]{width:11ch; min-width:0}
  .dice{width:30px; padding:0; display:inline-grid; place-items:center}
  .dice svg{display:block}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface-2)}
  .seg button{border:0; border-radius:0; background:transparent; color:var(--muted); height:28px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{color:var(--text)}
  [aria-pressed=true]{background:var(--moon)!important; color:#14101C!important; border-color:var(--moon)}
  .seg [aria-pressed=true]{border-color:var(--line)}
  label.rng{display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 10px;
    border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--muted)}
  input[type=range]{width:72px; accent-color:var(--moon); margin:0}
  main{flex:1; display:grid; place-items:center; padding:0 16px; min-height:0}
  .frame{
    width:100%; max-width:min(1100px, calc((100dvh - 132px) * 16 / 9));
    min-width:min(100%, 320px);
    border:1px solid var(--line); border-radius:6px; padding:4px; background:#0B0812;
  }
  canvas{
    display:block; width:100%; height:auto; aspect-ratio:16/9; border-radius:2px;
    image-rendering:crisp-edges; image-rendering:pixelated;
    touch-action:none; cursor:crosshair;
  }
  .frame:fullscreen{max-width:none; border:0; border-radius:0; padding:0; background:#000; display:grid; place-items:center}
  .frame:fullscreen canvas{width:min(100vw, 177.78vh); border-radius:0}
  footer{padding:12px 16px 16px; text-align:center; color:var(--muted); font-size:11px}
  @media (max-width:520px){
    header{padding:12px 12px 10px}
    h1{flex-basis:100%}
    main{padding:0 12px; place-items:start center}
    input[type=text]{width:11ch}
    input[type=range]{width:74px}
  }
</style>
</head>
<body>
<header>
  <h1><span class="r">CHROMO</span><span class="b">DEPTH</span></h1>
  <span class="grp">
    <select id="mood" aria-label="Mood"></select>
    <button class="dice" id="moodDice" aria-label="Random mood" title="Random mood"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><g fill="currentColor"><rect x="3.5" y="3.5" width="2" height="2"/><rect x="8.5" y="8.5" width="2" height="2"/><rect x="6" y="6" width="2" height="2"/></g></svg></button>
  </span>
  <span class="grp">
    <input type="text" id="seed" aria-label="Seed" placeholder="seed" spellcheck="false" autocomplete="off" maxlength="32">
    <button class="dice" id="seedDice" aria-label="Random seed" title="Random seed"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><g fill="currentColor"><rect x="3.5" y="3.5" width="2" height="2"/><rect x="8.5" y="3.5" width="2" height="2"/><rect x="6" y="6" width="2" height="2"/><rect x="3.5" y="8.5" width="2" height="2"/><rect x="8.5" y="8.5" width="2" height="2"/></g></svg></button>
  </span>
  <span class="seg" role="group" aria-label="Ground">
    <button data-ground="night">Night</button><button data-ground="paper">Paper</button>
  </span>
  <span class="seg" role="group" aria-label="Direction">
    <button data-dir="red">Red forward</button><button data-dir="blue">Blue forward</button>
  </span>
  <label class="rng">Intensity <input type="range" id="intensity" min="0" max="100" step="1"></label>
  <button id="drift">Drift</button>
  <button id="save">Save PNG</button>
  <button id="full">Fullscreen</button>
</header>
<main>
  <div class="frame" id="frame"><canvas id="view" width="960" height="540" role="img" aria-label="Generated chromostereopsis pixel scene"></canvas></div>
</main>
<footer>Rest your eyes — depth is doing the work.</footer>

<script>
(() => {
'use strict';

/* ───────────────────────── GRID ─────────────────────────
   The scene lives on a 240x135 grid of chunky pixels. Each depth layer is
   generated M pixels wider than the view on every side so layers can slide
   against each other without showing an edge. The visible canvas has a 4x
   backing store (960x540): every chunky pixel is a crisp 4x4 block, and a
   layer can sit a quarter of a chunky pixel off its neighbours. */
const VW = 240, VH = 135, M = 8, GW = VW + M * 2, GH = VH + M * 2, S = 4;
const FAR = 0, MID = 1, NEAR = 2;

/* ───────────────────── FAMILY DISCIPLINE ─────────────────────
   A layer never stores a colour. It stores a SHADE STEP, 1..5 (0 = empty):
     1 whisper · 2 quiet · 3 body (the pure saturated hue) · 4 strong · 5 the one hot highlight
   The step only becomes a colour at paint time, through the family that the
   layer's depth role is wearing right now:
     Red forward : FAR = blue,  MID = violet, NEAR = red
     Blue forward: FAR = red,   MID = violet, NEAR = blue
   So a scene element cannot cross families, there is no way to write
   "a red pixel" into the FAR layer. Swapping Direction or Ground re-colours
   the very same grid. On Paper the ramp runs pale -> deep instead of
   deep -> light, so step 1 is always the one closest to the ground. */
const PAL = {
  night: {
    ground: '#06051A',
    blue:   ['#15105E', '#1F1FB4', '#2A3CFF', '#5C8DFF', '#A8D4FF'],
    violet: ['#33105C', '#63189E', '#A021D9', '#D940D0', '#FF7FE0'],
    red:    ['#5A0010', '#A80016', '#FF1420', '#FF5136', '#FF9A1F'],
  },
  paper: {
    ground: '#F3E8CE',
    blue:   ['#B9C6EE', '#6F8DF2', '#1F36F0', '#151A9A', '#00A2FF'],
    violet: ['#D9B8E6', '#B36AD6', '#9320CC', '#561390', '#FF2BB8'],
    red:    ['#F2B6A6', '#F06A5A', '#EE1220', '#9C0014', '#FF6A00'],
  },
};
const familyOf = (role, dir) =>
  role === MID ? 'violet' : (role === NEAR) === (dir === 'red') ? 'red' : 'blue';

/* ───────────────────────── SEED ───────────────────────── */
function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ───────────────────── PIXEL TOOLKIT ───────────────────── */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
// Ordered dither: true for a fraction t of pixels. t = .5 is a plain checker.
const dz = (x, y, t) => BAYER[((y & 3) << 2) | (x & 3)] < t * 16;

class Layer {
  constructor() { this.b = new Uint8Array(GW * GH); this.mask = null; this.flip = false; }
  // View coordinates: (0,0) is the top-left visible pixel, negatives are margin.
  set(x, y, s) {
    x = Math.floor(x); y = Math.floor(y);
    if (this.flip) x = VW - 1 - x;
    const gx = x + M, gy = y + M;
    if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return;
    const i = gy * GW + gx;
    this.b[i] = s;
    if (this.mask) this.mask[i] = 0;
  }
  get(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (this.flip) x = VW - 1 - x;
    const gx = x + M, gy = y + M;
    if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return 0;
    return this.b[gy * GW + gx];
  }
  rect(x, y, w, h, s) {
    x = Math.round(x); y = Math.round(y);
    const fn = typeof s === 'function' ? s : null;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const v = fn ? fn(x + i, y + j, i, j) : s;
      if (v) this.set(x + i, y + j, v);
    }
  }
  // s: shade, or (dx, dy, x, y) => shade | 0 to skip
  disc(cx, cy, r, s) {
    cx = Math.round(cx); cy = Math.round(cy);
    const R = Math.ceil(r), lim = r * r + r * 0.6, fn = typeof s === 'function' ? s : null;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      if (dx * dx + dy * dy > lim) continue;
      const v = fn ? fn(dx, dy, cx + dx, cy + dy) : s;
      if (v) this.set(cx + dx, cy + dy, v);
    }
  }
  line(x0, y0, x1, y1, s) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    for (;;) {
      this.set(x0, y0, s);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  }
  // Fill under a height profile h[] (one top-y per grid column) down to yb.
  // fn(x, y, depthBelowTop, gx) => shade | 0
  field(h, yb, fn) {
    for (let gx = 0; gx < GW; gx++) {
      const x = gx - M, top = h[gx];
      const bot = typeof yb === 'function' ? yb(x, gx) : yb;
      for (let y = top; y <= bot; y++) {
        const v = typeof fn === 'function' ? fn(x, y, y - top, gx) : fn;
        if (v) this.set(x, y, v);
      }
    }
  }
}

// Height profiles, indexed by grid column (view x + M).
function smooth(R, base, amp, f) {
  const p1 = R() * 6.283, p2 = R() * 6.283, p3 = R() * 6.283, f1 = f * (0.7 + R() * 0.6);
  const h = new Array(GW);
  for (let i = 0; i < GW; i++)
    h[i] = Math.round(base + amp * (Math.sin(i * f1 + p1) * 0.6 + Math.sin(i * f1 * 2.3 + p2) * 0.28 + Math.sin(i * f1 * 4.7 + p3) * 0.12));
  return h;
}
function jagged(R, base, amp, rough) {
  const n = 257, a = new Float32Array(n);
  a[0] = (R() - 0.5) * amp; a[n - 1] = (R() - 0.5) * amp;
  for (let step = n - 1, sc = amp; step > 1; step >>= 1, sc *= rough) {
    const half = step >> 1;
    for (let i = half; i < n; i += step) a[i] = (a[i - half] + a[i + half]) / 2 + (R() - 0.5) * sc;
  }
  const h = new Array(GW);
  for (let i = 0; i < GW; i++) h[i] = Math.round(base + a[i]);
  return h;
}

/* ───────────────────── FAR BAND PARTS ───────────────────── */
// Sky: step 1 only, dithered denser toward the horizon in 8 hard bands.
function sky(sc, yh, glow) {
  const L = sc.far;
  for (let y = -M; y < VH + M; y++) {
    const t = Math.min(1, (y + M) / (yh + M));
    const v = Math.floor(Math.pow(t, 1.8) * glow * 8 + 0.5) / 8;
    if (v <= 0) continue;
    for (let x = -M; x < VW + M; x++) if (dz(x, y, v)) L.set(x, y, 1);
  }
}
function sunDisc(sc, cx, cy, r, kind, U) {
  const L = sc.far;
  sc.discX = L.flip ? VW - 1 - cx : cx;
  if (kind === 'sun') {
    // Retro sun: slits opening toward the bottom, light dithered into the top.
    const slit = dy => {
      const u = dy / r;
      return (u > 0.20 && u < 0.27) || (u > 0.42 && u < 0.53) || (u > 0.66 && u < 0.80);
    };
    L.disc(cx, cy, r, (dx, dy, x, y) => {
      if (slit(dy)) return 0;
      const u = dy / r;
      if (u < -0.35) return dz(x, y, 0.5) ? 5 : 4;
      if (u > 0.55) return dz(x, y, 0.5) ? 3 : 4;
      return 4;
    });
  } else {
    L.disc(cx, cy, r, (dx, dy, x, y) => {
      const lit = (dx + r * 0.3) * (dx + r * 0.3) + (dy + r * 0.3) * (dy + r * 0.3) < r * r * 0.34;
      if (lit) return dz(x, y, 0.25) ? 5 : 4;
      if (dx > r * 0.42) return dz(x, y, 0.5) ? 3 : 4;
      return 4;
    });
    const n = U.ri(3, 5);
    for (let i = 0; i < n; i++) {
      const a = U.R() * 6.283, d = U.R() * r * 0.62;
      L.disc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 0.8 + U.R() * r * 0.14, (dx, dy, x, y) => (L.get(x, y) >= 4 ? 3 : 0));
    }
  }
}
function clouds(sc, yh, n, U) {
  const L = sc.far;
  for (let k = 0; k < n; k++) {
    const y = yh - U.ri(6, 34), len = U.ri(22, 70), x = U.ri(-M, VW - 10), th = U.ri(1, 2);
    for (let j = 0; j < th; j++) {
      const inset = j * U.ri(3, 9);
      for (let i = inset; i < len - inset; i++) {
        const e = Math.min(i - inset, len - inset - 1 - i) / 7;
        if (e >= 1 || dz(x + i, y + j, e)) L.set(x + i, y + j, 2);
      }
    }
  }
}
// Stars go on last and only into open sky (steps 0/1), so nothing else in FAR
// is ever overwritten by the twinkle pass.
function stars(sc, yMax, n, U) {
  const L = sc.far, open = (x, y) => L.get(x, y) <= 1;
  for (let i = 0; i < n; i++) {
    const x = U.ri(-M, VW + M - 1), y = Math.floor(-M + Math.pow(U.R(), 1.3) * (yMax + M));
    const s = U.pick([3, 3, 3, 4, 4, 5]);
    if (!open(x, y)) continue;
    L.set(x, y, s);
    sc.stars.push({ x: L.flip ? VW - 1 - x : x, y, s, ph: U.ri(0, 30), per: U.ri(5, 11) });
  }
  const sp = U.ri(3, 6);
  for (let i = 0; i < sp; i++) {                       // a few 2px sparkles
    const x = U.ri(2, VW - 4), y = U.ri(2, Math.max(4, yMax - 14));
    if (!(open(x, y) && open(x + 1, y) && open(x, y + 1) && open(x + 1, y + 1))) continue;
    for (let j = 0; j < 2; j++) for (let k = 0; k < 2; k++) {
      L.set(x + k, y + j, 5);
      sc.stars.push({ x: L.flip ? VW - 1 - (x + k) : x + k, y: y + j, s: 5, ph: i * 7, per: 9 });
    }
  }
}

/* ───────────────────── MID BAND PARTS ───────────────────── */
// Water: a checker gradient of steps 1 and 2, plus a list of glints that the
// animation pass crawls sideways. sc.mid.mask remembers which pixels are still
// open water after everything else in MID has been drawn over it.
function water(sc, y0, y1, U) {
  const L = sc.mid;
  for (let y = y0; y <= y1; y++) {
    const t = (y - y0) / Math.max(1, y1 - y0);
    const v = Math.round((0.12 + 0.76 * t) * 8) / 8;
    for (let x = -M; x < VW + M; x++) {
      L.set(x, y, dz(x, y, v) ? 2 : 1);
      const ax = L.flip ? VW - 1 - x : x;
      L.mask[(y + M) * GW + ax + M] = 1;
    }
  }
  const n = Math.round((y1 - y0 + 1) * 3.2);
  for (let i = 0; i < n; i++) {
    const y = U.ri(y0 + 1, y1), d = (y - y0) / Math.max(1, y1 - y0);
    const column = U.ch(0.55);                           // reflection under the disc
    const spread = 5 + d * 22;
    let ax = column ? Math.round(sc.discX + (U.R() + U.R() + U.R() - 1.5) * spread) : U.ri(-M, VW + M - 1);
    const len = 1 + U.ri(0, 1 + Math.floor(d * 4));
    const s = column ? (U.ch(0.3) ? 5 : 4) : U.pick([3, 3, 4]);
    sc.glints.push({ x: ax, y, len, s });
  }
}
function pineTiny(L, x, base, h, s) {
  for (let i = 0; i < h; i++) {
    const half = Math.floor(i * 0.42 + 0.3);
    L.rect(x - half, base - h + i, half * 2 + 1, 1, s);
  }
  L.set(x, base, s);
}
function roundTree(L, x, base, r, s) {
  L.rect(x, base - 2, 1, 3, s);
  L.disc(x, base - r - 2, r, s);
}

/* ───────────────────── NEAR BAND PARTS ───────────────────── */
function ground(L, h) {
  L.field(h, VH + M, (x, y, d) => (d === 0 ? 4 : d < 2 ? 3 : d < 6 ? (dz(x, y, 0.5) ? 3 : 2) : 2));
}
function blade(L, x, base, h, lean, s, w = 1) {
  for (let i = 0; i <= h; i++) {
    const t = i / h, xx = Math.round(x + lean * t * t), ww = Math.max(1, Math.round(w * (1 - t)));
    L.rect(xx - (ww >> 1), base - i, ww, 1, s);
  }
}
function grass(L, h, n, U, tall = 11) {
  for (let i = 0; i < n; i++) {
    const x = U.ri(-M, VW + M - 1);
    blade(L, x, h[x + M] + 1, U.ri(3, tall), U.ri(-4, 4), U.pick([3, 3, 4, 2]));
  }
}
function leaf(L, x, y, dir, len) {
  for (let i = 0; i <= len; i++) {
    const t = i / len, th = Math.max(1, Math.round(Math.sin(t * Math.PI) * len * 0.24));
    const yy = y - Math.round(Math.sin(t * Math.PI * 0.8) * len * 0.45);
    L.rect(x + dir * i, yy, 1, th, 3);
    if (th > 1) L.set(x + dir * i, yy + th - 1, 2);
  }
}
// One flower routine at every size, from a 3px dot to the cropped giant.
function flower(L, U, x, base, h, r, kind, lean) {
  const hx = Math.round(x + lean), hy = base - h, sw = r >= 14 ? 4 : r >= 6 ? 2 : 1;
  for (let i = 0; i <= h; i++) {
    const t = i / h, xx = Math.round(x + lean * t * t) - (sw >> 1);
    L.rect(xx, base - i, sw, 1, 2);
    if (sw >= 2) L.set(xx, base - i, 3);
  }
  if (r >= 4) {
    const n = r >= 14 ? 3 : U.ri(1, 2);
    for (let k = 0; k < n; k++) {
      const t = 0.15 + 0.5 * U.R();
      leaf(L, Math.round(x + lean * t * t), base - Math.round(h * t), k % 2 ? 1 : -1, Math.round(r * (0.9 + U.R() * 0.7)));
    }
  }
  if (r <= 2) {
    if (r === 2) L.rect(hx - 1, hy - 1, 3, 3, 3);
    L.set(hx - r, hy, 3); L.set(hx + r, hy, 3); L.set(hx, hy - r, 3); L.set(hx, hy + r, 3);
    L.set(hx, hy, 5);
    return;
  }
  if (kind === 0) {                                      // daisy
    const n = r >= 10 ? 9 : r >= 5 ? 7 : 5, rot = U.R() * 6.283, pr = Math.max(1, r * 0.38), dist = r * 0.64;
    for (let k = 0; k < n; k++) {
      const a = rot + (k * 6.283) / n;
      L.disc(hx + Math.cos(a) * dist, hy + Math.sin(a) * dist, pr, 3);
    }
    if (r >= 6) for (let k = 0; k < n; k++) {
      const a = rot + (k * 6.283) / n;
      L.disc(hx + Math.cos(a) * dist * 1.05, hy + Math.sin(a) * dist * 1.05, pr * 0.5, (dx, dy, X, Y) => (dz(X, Y, 0.5) ? 4 : 0));
    }
    L.disc(hx, hy, Math.max(1, r * 0.36), 2);
    L.disc(hx, hy, Math.max(0.6, r * 0.22), 5);
  } else if (kind === 1) {                               // tulip
    for (let dy = -r; dy <= r; dy++) {

/* ───────────────────────── MOODS ─────────────────────────

function genScene(seed, mood) {
  // Every random choice in the scene comes from this one generator.
  const R = mulberry32(hashStr(seed + '\u0001' + mood));
  const U = {
    R,
    ri: (a, b) => a + Math.floor(R() * (b - a + 1)),
    pick: a => a[Math.floor(R() * a.length)],
    ch: p => R() < p,
  };
  const sc = { far: new Layer(), mid: new Layer(), near: new Layer(), stars: [], glints: [], discX: 120 };
  sc.mid.mask = new Uint8Array(GW * GH);
  const mirror = U.ch(0.5);
  sc.far.flip = sc.mid.flip = sc.near.flip = mirror;
  MOODS[mood](sc, U);
  sc.base = [sc.far.b, sc.mid.b, sc.near.b];
  sc.work = [new Uint8Array(sc.far.b), new Uint8Array(sc.mid.b), sc.near.b];
  return sc;
}

const limg = lctx.map(c => c.createImageData(GW, GH));
let scene = null, tick = 0, t = 0, last = 0, raf = 0, lastKey = '';
const par = { x: 0, y: 0 }, parT = { x: 0, y: 0 }, chn = { x: 0, y: 0 }, ptr = { x: 0, y: 0, at: -1e9, on: false };
const off = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

/* ───────────────────────── PAINT ───────────────────────── */
function rgbRamp(role) {
  // Intensity pulls saturation from muted (0) up to the full ramp (1).
  const sat = 0.45 + 0.55 * Math.sqrt(state.intensity);
  const out = new Uint8Array(15);
  PAL[state.ground][familyOf(role, state.dir)].forEach((h, i) => {
    const c = [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16));
    const l = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
    for (let k = 0; k < 3; k++) out[i * 3 + k] = Math.round(l + (c[k] - l) * sat);
  });
  return out;
}
function paint(role) {
  const buf = scene.work[role], d = limg[role].data, ramp = rgbRamp(role);
  for (let p = 0, q = 0; p < buf.length; p++, q += 4) {
    const s = buf[p];
    if (s) { const k = (s - 1) * 3; d[q] = ramp[k]; d[q + 1] = ramp[k + 1]; d[q + 2] = ramp[k + 2]; d[q + 3] = 255; }
    else d[q + 3] = 0;
  }
  lctx[role].putImageData(limg[role], 0, 0);
}
// The two small animated details. k is the 400ms step; k = 0 is the poster.
function dynamics(k) {
  const f = scene.work[FAR], m = scene.work[MID], mask = scene.mid.mask;
  f.set(scene.base[FAR]); m.set(scene.base[MID]);
  if (k > 0) for (const st of scene.stars)                 // twinkle: one shade step, held 800ms
    if (((k >> 1) + st.ph) % st.per === 0) f[(st.y + M) * GW + st.x + M] = st.s - 1;
  for (const g of scene.glints) for (let i = 0; i < g.len; i++) {
    const gx = (((g.x + M + i + k) % GW) + GW) % GW, idx = (g.y + M) * GW + gx;
    if (mask[idx]) m[idx] = g.s;
  }
}
function layerOffsets() {
  for (const o of off) o.x = o.y = 0;
  if (!motionOK()) return;
  const q = v => Math.round(v * S) / S, I = state.intensity;
  const redRole = state.dir === 'red' ? NEAR : FAR;
  const breathe = I > 0 ? Math.sin((t / 8000) * Math.PI * 2) : 0;   // NEAR breathes ±1px on 8s
  const depth = [0.25, 0.5, 1];                                      // parallax: far 1px, mid 2px, near 4px
  for (let r = 0; r < 3; r++) {
    /* CHANNEL DRIFT. To be honest about it: chromostereopsis happens in the
       eye, the picture needs no help to float. This offset is a stage trick
       layered on top, sliding the red family against the blue family by up to
       2px toward the pointer so the two planes visibly part. Intensity 0 = none. */
    const w = r === redRole ? 1 : r === MID ? 0.5 : 0;
    off[r].x = q(par.x * depth[r] + (r === NEAR ? breathe : 0) + chn.x * w);
    off[r].y = q(par.y * depth[r] + chn.y * w);
  }
}
function compose(force) {
  layerOffsets();
  const key = off.map(o => o.x + ',' + o.y).join('|');
  if (!force && key === lastKey) return;
  lastKey = key;
  vctx.imageSmoothingEnabled = false;
  vctx.fillStyle = PAL[state.ground].ground;
  vctx.fillRect(0, 0, view.width, view.height);
  for (let r = 0; r < 3; r++)
    vctx.drawImage(lcan[r], Math.round((off[r].x - M) * S), Math.round((off[r].y - M) * S), GW * S, GH * S);
}
function repaint() { for (let r = 0; r < 3; r++) paint(r); compose(true); }
function rebuild() {
  scene = genScene(state.seed, state.mood);
  dynamics(motionOK() ? tick : 0);
  repaint();
}

/* ───────────────────────── LOOP ───────────────────────── */
function frame(now) {
  raf = 0;
  if (!motionOK() || document.hidden) return;
  const dt = Math.min(100, now - last); last = now; t += dt;
  const I = state.intensity, k = Math.min(1, dt * 0.006);
  parT.x = ptr.on ? -ptr.x * 4 : 0; parT.y = ptr.on ? -ptr.y * 2 : 0;
  par.x += (parT.x - par.x) * k; par.y += (parT.y - par.y) * k;
  const live = ptr.on && now - ptr.at < 1400;              // channel drift eases home when idle
  const cx = live ? ptr.x * 2 * I * I : 0, cy = live ? ptr.y * I * I : 0, k2 = Math.min(1, dt * 0.004);
  chn.x += (cx - chn.x) * k2; chn.y += (cy - chn.y) * k2;
  const nt = Math.floor(t / 400);
  let force = false;
  if (nt !== tick) { tick = nt; dynamics(tick); paint(FAR); paint(MID); force = true; }
  compose(force);
  raf = requestAnimationFrame(frame);
}
function sync() {                                          // start, stop or settle the loop
  if (motionOK() && !document.hidden) {
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  } else {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (!motionOK() && scene) { par.x = par.y = chn.x = chn.y = 0; dynamics(0); repaint(); }
  }
}
document.addEventListener('visibilitychange', sync);
reduced.addEventListener ? reduced.addEventListener('change', sync) : reduced.addListener(sync);

function point(e) {
  const b = view.getBoundingClientRect();
  ptr.x = Math.max(-1, Math.min(1, ((e.clientX - b.left) / b.width) * 2 - 1));
  ptr.y = Math.max(-1, Math.min(1, ((e.clientY - b.top) / b.height) * 2 - 1));
  ptr.at = performance.now(); ptr.on = true;
}
view.addEventListener('pointermove', point);
view.addEventListener('pointerdown', point);
for (const ev of ['pointerleave', 'pointercancel']) view.addEventListener(ev, () => { ptr.on = false; });
view.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') ptr.on = false; });

/* ───────────────────────── CHROME ───────────────────────── */
const ui = { mood: $('mood'), seed: $('seed'), intensity: $('intensity'), drift: $('drift') };
for (const m of moodNames) ui.mood.add(new Option(m[0].toUpperCase() + m.slice(1), m));
function reflect() {
  ui.mood.value = state.mood;
  if (document.activeElement !== ui.seed) ui.seed.value = state.seed;
  ui.intensity.value = Math.round(state.intensity * 100);
  ui.drift.setAttribute('aria-pressed', state.drift);
  document.querySelectorAll('[data-ground]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ground === state.ground));
  document.querySelectorAll('[data-dir]').forEach(b => b.setAttribute('aria-pressed', b.dataset.dir === state.dir));
  try {
    history.replaceState(null, '', '#' + new URLSearchParams({ seed: state.seed, mood: state.mood, ground: state.ground, dir: state.dir }));
  } catch (e) {}
}
function randomSeed() {
  const c = 'bdfghklmnprstvz', v = 'aeiou', p = s => s[Math.floor(Math.random() * s.length)];
  return p(c) + p(v) + p(c) + p(v) + p(c) + p(v) + '-' + String(Math.floor(Math.random() * 900) + 100);
}
ui.mood.addEventListener('change', () => { state.mood = ui.mood.value; reflect(); rebuild(); });
$('moodDice').addEventListener('click', () => {
  const others = moodNames.filter(m => m !== state.mood);
  state.mood = others[Math.floor(Math.random() * others.length)]; reflect(); rebuild();
});
ui.seed.addEventListener('input', () => { state.seed = ui.seed.value; reflect(); rebuild(); });
$('seedDice').addEventListener('click', () => { state.seed = randomSeed(); reflect(); rebuild(); });
document.querySelectorAll('[data-ground]').forEach(b => b.addEventListener('click', () => { state.ground = b.dataset.ground; reflect(); repaint(); }));
document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => { state.dir = b.dataset.dir; reflect(); repaint(); }));
ui.intensity.addEventListener('input', () => { state.intensity = ui.intensity.value / 100; repaint(); });
ui.drift.addEventListener('click', () => { state.drift = !state.drift; reflect(); sync(); if (motionOK()) { dynamics(tick); repaint(); } });
$('save').addEventListener('click', () => {
  // The backing store already is the 4x frame, so this is exactly what is on screen.
  view.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `chromodepth-${state.mood}-${state.seed.replace(/[^\w-]+/g, '_') || 'seed'}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }, 'image/png');
});
$('full').addEventListener('click', () => {
  const f = $('frame');
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (f.requestFullscreen || f.webkitRequestFullscreen || (() => {})).call(f);
});

reflect();
rebuild();
sync();

// Handle for poking at a scene from the console.
window.CHROMODEPTH = { state, MOODS, PAL, genScene, familyOf, get scene() { return scene; }, get offsets() { return off; }, grid: { VW, VH, M, GW, GH, S } };
})();
</script>
</body>
</html>
