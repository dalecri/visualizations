<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one full-bleed drawing sheet, a name plate pinned top-left, one quiet control bar along the bottom. */
:root{
  --paper:#ffffff; --ink:#1c1a17; --mute:#77726a; --rule:rgba(28,26,23,.16);
  --mono:"Space Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;overflow:hidden;transition:background .25s}
#stage{flex:1;min-height:0;display:flex;padding-block:64px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#art{flex:1;min-width:0;min-height:0}
#art svg{width:100%;height:100%;display:block}
.plate,.plate:hover{color:var(--ink);background:var(--paper);text-align:left;cursor:pointer;font:inherit}
.plate small{display:flex;justify-content:space-between;gap:14px}
#lang b{color:var(--ink)}
.plate{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:calc(100% - 32px);border:1px solid var(--ink);background:var(--paper);padding:6px 10px 7px;display:flex;flex-direction:column;gap:1px}
.plate small{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.plate b{font-weight:700;font-size:13px;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-top:1px solid var(--rule);background:var(--paper);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grp{display:inline-flex;align-items:center;gap:6px}
button,select,input{font:inherit;color:var(--ink)}
button,select{background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:5px 9px;cursor:pointer;line-height:1.2}
button:hover,button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select:disabled,button:disabled{opacity:.35;cursor:default}
button:disabled:hover{background:var(--paper);color:var(--ink)}
.pix{width:100%;height:100%;display:block;object-fit:contain;image-rendering:pixelated}
#art .wf{stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
#art .fl{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.4s ease-in-out infinite alternate}
@keyframes wave{to{transform:scaleX(.8) skewY(5deg)}}
#art .cat{cursor:pointer}
#art .hop{animation:hop 2.8s ease-in-out infinite}
@keyframes hop{0%,68%,100%{transform:none}78%{transform:translateY(-.24px)}88%{transform:translateY(0)}}
#art .zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{opacity:.2}}
#bubble{position:fixed;z-index:5;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:6px 10px 7px;max-width:220px;pointer-events:none}
#bubble b{display:block;font-size:12px}#bubble span{font-size:10px;color:var(--mute)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--paper);border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.strip{display:flex;gap:8px;overflow-x:auto;border-top:1px solid var(--rule);background:var(--paper);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip button{flex:0 0 auto;width:92px;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;border-color:var(--rule)}
.strip button:hover,.strip button.cur{background:var(--paper);color:var(--ink);border-color:var(--ink)}
.strip svg{width:82px;height:82px;display:block}
.seg{display:inline-flex}.seg button+button{border-left:0}
#seed{width:14ch;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:4px 0;border-radius:0}
label{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
input[type=range]{accent-color:var(--ink);width:88px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.push{margin-left:auto}
#art.build .e{animation:drop .5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i)*55ms)}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 12px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (max-width:560px){.push{margin-left:0}input[type=range]{width:72px}.bar{gap:8px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ---------- seeded randomness: mulberry32, one named stream per subsystem ---------- */
function xmur3(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function stream(seed,name){const r=mulberry32(xmur3(seed+'/'+name));return{f:r,int:n=>Math.floor(r()*n),range:(a,b)=>a+r()*(b-a),pick:a=>a[Math.floor(r()*a.length)],chance:p=>r()<p}}

/* ---------- names ---------- */
// [English, French masculine, French feminine]; nouns carry their French gender
const ADJ=[['Sunken','englouti','engloutie'],['Hollow','creux','creuse'],['Silent','silencieux','silencieuse'],['Gilded','doré','dorée'],['Drowned','noyé','noyée'],['Leaning','penché','penchée'],['Winding','sinueux','sinueuse'],['Pale','pâle','pâle'],['Lantern','aux lanternes','aux lanternes'],['Forgotten','oublié','oubliée'],['Crooked','tordu','tordue'],['Salt','de sel','de sel'],['Upper','supérieur','supérieure'],['Ashen','cendré','cendrée'],['Quiet','paisible','paisible'],['Patient','patient','patiente']];
const NOUN=[['Belfry','Beffroi','m'],['Archive','Archive','f'],['Cistern','Citerne','f'],['Observatory','Observatoire','m'],['Granary','Grenier','m'],['Lighthouse','Phare','m'],['Aqueduct','Aqueduc','m'],['Library','Bibliothèque','f'],['Reliquary','Reliquaire','m'],['Mill','Moulin','m'],['Bastion','Bastion','m'],['Stair','Escalier','m'],['Orrery','Planétaire','m'],['Rookery','Corbeautière','f'],['Conservatory','Conservatoire','m']];
const ORD=[['Ninth','Neuvième','Neuvième'],['Seventh','Septième','Septième'],['Last','Dernier','Dernière'],['First','Premier','Première'],['Eleventh','Onzième','Onzième'],['Third','Troisième','Troisième'],['Twelfth','Douzième','Douzième'],['Fourth','Quatrième','Quatrième']];
const SYL=['ve','lo','ra','mir','tha','sel','or','qua','zen','li','dor','an','is','eth','ka','mu','vel','ne','os','ty'];
function towerName(seed){
  const N=stream(seed,'name');
  let pl='';const k=2+N.int(2);for(let i=0;i<k;i++)pl+=N.pick(SYL);pl=pl[0].toUpperCase()+pl.slice(1);
  const a=N.pick(ADJ),n=N.pick(NOUN),o=N.pick(ORD),p=N.int(5);
  const V=/^[aeiouéèêh]/i,g=n[2]==='f'?2:1,art=w=>V.test(w)?"L'":g===2?'La ':'Le ',de=w=>V.test(w)?"d'":'de ';
  const en=[`The ${a[0]} ${n[0]}`,`The ${n[0]} of ${pl}`,`Tower of the ${o[0]} ${n[0]}`,`The ${a[0]} Stair of ${pl}`,`${pl} ${n[0]}`][p];
  const fr=[`${art(n[1])}${n[1]} ${a[g]}`,`${art(n[1])}${n[1]} ${de(pl)}${pl}`,`La Tour ${g===2?'de la':'du'} ${o[g]} ${n[1]}`,`L'Escalier ${a[1]} ${de(pl)}${pl}`,`${art(n[1])}${n[1]} ${pl}`][p];
  return{en,fr};
}

/* ---------- the grammar ---------- */
const FOOT=[[1,1],[2,1],[1,2],[2,2]];
function generate(seed,height,chaos,opt){
  const M=stream(seed,'mass'),T=stream(seed,'tops'),D=stream(seed,'detail'),W=stream(seed,'water');
  const P=5+M.int(2),OFF=3,G=P+2*OFF;
  const Hm=new Array(G*G).fill(0);
  const hAt=(x,y)=>(x<-OFF||y<-OFF||x>=P+OFF||y>=P+OFF)?99:Hm[(x+OFF)*G+(y+OFF)];
  const hSet=(x,y,v)=>{Hm[(x+OFF)*G+(y+OFF)]=v};
  const on=(x,y)=>x>=0&&y>=0&&x<P&&y<P;
  const ents=[];
  const plinth={kind:'plinth',x0:0,y0:0,z0:0,x1:P,y1:P,z1:1,ci:-1,det:[]};ents.push(plinth);
  for(let x=0;x<P;x++)for(let y=0;y<P;y++)hSet(x,y,1);
  const ns=1+M.int(2);
  for(let s=0;s<ns;s++)ents.push({kind:'step',x0:P+s*.5,x1:P+(s+1)*.5,y0:P-1.6,y1:P-.4,z0:0,z1:(ns-s)/(ns+1),ci:-1,det:[]});

  const lo=9+Math.round(height*4),n=Math.min(16,lo+M.int(4));
  const maxZ=4+Math.round(height*4);
  const blocks=[];
  for(let i=0;i<n;i++){
    const cyl=M.chance(.17);
    const [w,d]=cyl?[1,1]:(i<n/3?M.pick([[2,2],[2,2],[2,1],[1,2]]):M.pick(FOOT));
    const h=1+M.int(3);
    const off=chaos>.3;
    let best=null,bs=-1e9;
    for(let x0=off?-1:0;x0<=(off?P+1-w:P-w);x0++)for(let y0=off?-1:0;y0<=(off?P+1-d:P-d);y0++){
      let top=0,mn=99,offc=0;
      for(let x=x0;x<x0+w;x++)for(let y=y0;y<y0+d;y++){const v=hAt(x,y);top=Math.max(top,v);mn=Math.min(mn,v);if(!on(x,y))offc++}
      const jit=M.f();
      if(top===0||top>=99)continue;
      if(offc&&top<2)continue;
      const cx=x0+w/2,cy=y0+d/2,dist=Math.hypot(cx-P/2,cy-P/2);
      let s=.9*top-dist*(.35+.22*top)-(cx+cy-P)*.15*top+jit*1.8;
      if(mn<top)s-=(1-chaos)*7+.5;
      s-=offc*(1-chaos)*9;
      if(top+h>maxZ)s-=20;
      if(s>bs){bs=s;best={x0,y0,top,over:mn<top}}
    }
    if(!best)continue;
    let z0=best.top;
    if(chaos>.5&&z0>=2&&M.chance(chaos*.22))z0+=1;
    const b={kind:cyl?'cyl':'box',x0:best.x0,y0:best.y0,x1:best.x0+w,y1:best.y0+d,z0,z1:z0+h,ci:M.int(5),det:[]};
    if(cyl){b.cx=b.x0+.5;b.cy=b.y0+.5;b.r=.42}
    for(let x=b.x0;x<b.x1;x++)for(let y=b.y0;y<b.y1;y++)hSet(x,y,b.z1);
    blocks.push(b);ents.push(b);
  }
  // topmost blocks get one top each
  for(const b of blocks){
    let tm=true;for(let x=b.x0;x<b.x1;x++)for(let y=b.y0;y<b.y1;y++)if(hAt(x,y)!==b.z1)tm=false;
    if(!tm)continue;
    const w=b.x1-b.x0,d=b.y1-b.y0;
    const t=b.kind==='cyl'?T.pick(['dome','cone','tank','cone','spire']):w===1&&d===1?T.pick(['spire','cone','dome','rail','tank']):w===2&&d===2?T.pick(['rail','dome','tank','rail','cone']):T.pick(['rail','gable','gable','tank']);
    const r=b.kind==='cyl'?b.r:Math.min(w,d)/2*.8;
    b.top={t,r,h:{rail:.3,dome:r*1.22+.3,cone:1,spire:2.2,tank:1.25,gable:.6}[t]};
  }
  // flag on the highest top (by screen height)
  let fl=null,fy=1e9;for(const b of blocks)if(b.top){const y=(b.x0+b.x1+b.y0+b.y1)/4/2-(b.z1+b.top.h);if(y<fy){fy=y;fl=b}}
  if(fl)fl.top.flag=true;
  // bridges between stacks at a shared level
  const covered=new Set();
  const nb=Math.min(4,Math.floor(chaos*3+M.f()*.9));
  if(nb>0){
    const cands=[],used=new Set();
    const boxes=blocks.filter(b=>b.kind==='box');
    for(const A of boxes)for(const B of boxes){
      if(A===B)continue;
      for(const ax of [0,1]){
        const gap=ax?B.y0-A.y1:B.x0-A.x1;if(gap<1||gap>3)continue;
        const r0=Math.max(ax?A.x0:A.y0,ax?B.x0:B.y0),r1=Math.min(ax?A.x1:A.y1,ax?B.x1:B.y1);
        for(let r=r0;r<r1;r++)for(let L=Math.max(A.z0,B.z0)+1;L<=Math.min(A.z1,B.z1);L++){
          let ok=true;for(let g=0;g<gap;g++){const c=ax?[r,A.y1+g]:[A.x1+g,r];if(hAt(c[0],c[1])>L-1)ok=false}
          if(ok)cands.push({A,B,ax,r,L,gap});
        }
      }
    }
    for(let k=0;k<nb&&cands.length;k++){
      const c=cands.splice(M.int(cands.length),1)[0];
      const key=c.ax+':'+c.r+':'+(c.ax?c.A.y1:c.A.x1);if(used.has(key)){k--;continue}used.add(key);
      const br=c.ax?{x0:c.r+.25,x1:c.r+.75,y0:c.A.y1,y1:c.B.y0}:{x0:c.A.x1,x1:c.B.x0,y0:c.r+.25,y1:c.r+.75};
      Object.assign(br,{kind:'bridge',ax:c.ax,z0:c.L-.22,z1:c.L,ci:c.A.ci,det:[]});
      ents.push(br);
      for(let x=Math.floor(br.x0);x<Math.ceil(br.x1);x++)for(let y=Math.floor(br.y0);y<Math.ceil(br.y1);y++)covered.add(x+','+y);
    }
  }
  // waterfalls: down a face to an exposed roof at the block's base
  const nw=Math.min(3,W.int(1+Math.round(chaos*3))+(chaos>.6?1:0));
  const wc=[];
  for(const b of blocks){
    if(b.kind!=='box'||b.z0<1)continue;
    for(let y=b.y0;y<b.y1;y++)if(on(b.x1,y)&&hAt(b.x1,y)===b.z0)wc.push({b,f:'r',u:y-b.y0+.5});
    for(let x=b.x0;x<b.x1;x++)if(on(x,b.y1)&&hAt(x,b.y1)===b.z0)wc.push({b,f:'l',u:x-b.x0+.5});
  }
  for(let k=0;k<nw&&wc.length;k++){
    const c=wc.splice(W.int(wc.length),1)[0];if(c.b.fall){k--;continue}
    c.b.fall={f:c.f,u:c.u,ph:W.range(0,6.28),rip:2+W.int(2)};
  }
  // open roofs: where trees grow and cats sit
  for(const b of blocks)if(b.fall){const u=Math.floor(b.fall.u);covered.add(b.fall.f==='r'?b.x1+','+(b.y0+u):(b.x0+u)+','+b.y1)}
  const owners=[plinth,...blocks.filter(b=>b.kind==='box')],surf=[];
  for(let x=-1;x<=P;x++)for(let y=-1;y<=P;y++){const h=hAt(x,y);if(h<1||h>=99||covered.has(x+','+y))continue;
    const o=owners.find(e=>x>=e.x0&&x<e.x1&&y>=e.y0&&y<e.y1&&e.z1===h);if(o&&!(o.top&&o.top.t!=='rail'))surf.push({x,y,z:h})}
  const Gd=stream(seed,'garden'),K=stream(seed,'cats');
  const nt=Gd.int(4);
  for(let i=0;i<nt&&surf.length;i++){const c=surf.splice(Gd.int(surf.length),1)[0],tt=Gd.pick(['round','cypress','round','pine']);
    ents.push({kind:'tree',tt,x0:c.x+.22,x1:c.x+.78,y0:c.y+.22,y1:c.y+.78,z0:c.z,z1:c.z+(tt==='cypress'?1.5:1.3),ci:-1,det:[]})}
  const low=surf.filter(c=>c.z<=2),up=surf.filter(c=>c.z>=3);
  for(let i=0;i<4;i++){ // two cats downstairs, two upstairs
    let pool=i<2?low:up;if(!pool.length)pool=i<2?up:low;if(!pool.length)break;
    const c=pool.splice(K.int(pool.length),1)[0],cx=c.x+.32+K.f()*.36,cy=c.y+.32+K.f()*.36;
    ents.push({kind:'cat',cat:i,dir:K.chance(.5)?1:-1,x0:cx-.16,x1:cx+.16,y0:cy-.16,y1:cy+.16,z0:c.z,z1:c.z+.7,ci:-1,det:[]});
  }
  // details
  for(const f of ['l','r']){const k=1+D.int(2);for(let i=0;i<k;i++){const lim=f==='r'?P-2.2:P-.6;plinth.det.push({t:'door',f,u:.6+D.f()*(lim-.6),a:.2,h:.66})}}
  for(const b of blocks){
    const h=b.z1-b.z0,arch=D.chance(.5);
    if(b.kind==='cyl'){
      const wide=D.chance(.5);
      for(let s=0;s<h;s++)if(D.chance(.78))for(const th of wide?[.35,.79,1.23]:[.79])b.det.push({t:'cw',th,v0:s+.3,v1:s+.66,arch});
      continue;
    }
    const sp=D.range(.42,.72);
    for(const f of ['l','r']){
      const L=f==='r'?b.y1-b.y0:b.x1-b.x0;
      let stair=false;
      if(h>=2&&L>=2&&D.chance(.2+chaos*.3)){stair=true;b.det.push(makeStair(D,f,L,h,chaos))}
      const lad=D.chance(.14),pipe=D.chance(.2),side=D.chance(.5);
      if(lad)b.det.push({t:'ladder',f,u:side?.1:L-.1});
      if(pipe)b.det.push({t:'pipe',f,u:side?L-.1:.1});
      if(stair)continue;
      const cnt=Math.max(1,Math.floor(L/sp)),o=(L-cnt*sp)/2+sp/2;
      for(let s=0;s<h;s++){
        if(!D.chance(.82))continue;
        for(let k=0;k<cnt;k++){const u=o+k*sp;if(b.fall&&b.fall.f===f&&Math.abs(u-b.fall.u)<.32)continue;b.det.push({t:'w',f,u,v0:s+.3,v1:s+.68,arch})}
      }
    }
  }
  if(opt&&opt.spooky){const Sp=stream(seed,'spooky'),pool=low.concat(up),np=2+Sp.int(2); // Hallowe'en pumpkins on the leftover open roofs
    for(let i=0;i<np&&pool.length;i++){const c=pool.splice(Sp.int(pool.length),1)[0],cx=c.x+.3+Sp.f()*.4,cy=c.y+.3+Sp.f()*.4,sz=.8+Sp.f()*.4;
      ents.push({kind:'pumpkin',sz,x0:cx-.17*sz,x1:cx+.17*sz,y0:cy-.17*sz,y1:cy+.17*sz,z0:c.z,z1:c.z+.35*sz,ci:-1,det:[]})}}
  const Lg=stream(seed,'lights'); // which windows glow at night

    const r=behind(ents[i],ents[j]);if(r===1){adj[i].push(j);ind[j]++}else if(r===-1){adj[j].push(i);ind[i]++}

}

function drawPumpkin(e,fill,night){

  C.o.push(`<path d="M${r2(x-.04*s)} ${r2(y-.74*s)} L${r2(x-.02*s)} ${r2(y-.98*s)} L${r2(x+.1*s)} ${r2(y-.96*s)} L${r2(x+.06*s)} ${r2(y-.72*s)}Z" fill="${fill?'#4f6b3a':'#ffffff'}" class="d"/>`);
  ell([x-.26*s,y-.38*s],.32*s,.37*s,sd,'d');ell([x+.26*s,y-.38*s],.32*s,.37*s,sd,'d');ell([x,y-.4*s],.36*s,.4*s,o,'d');
  poly([[x-.24*s,y-.44*s],[x-.08*s,y-.44*s],[x-.16*s,y-.58*s]],fc,'d');poly([[x+.08*s,y-.44*s],[x+.24*s,y-.44*s],[x+.16*s,y-.58*s]],fc,'d');
  poly([[x-.24*s,y-.3*s],[x+.24*s,y-.3*s],[x+.13*s,y-.17*s],[x,y-.23*s],[x-.13*s,y-.17*s]],fc,'d');

function nightOf(p){const n='#1a2140',d=c=>mix(c,n,.5);

function skyLayer(seed,x,y,w,h,night,spooky){
  const S=stream(seed,'sky'),o=[],top=y+14,band=h*.3;
  const bat=(a,b,s,f,st)=>o.push(`<path d="M${r2(a)} ${r2(b)} q${r2(-4*s)} ${r2(-4*s)} ${r2(-10*s)} ${r2(-2*s)} q${r2(3*s)} ${r2(2*s)} ${r2(2*s)} ${r2(5*s)} q${r2(3*s)} ${r2(-2*s)} ${r2(5*s)} 0 q${r2(2*s)} ${r2(-2*s)} ${r2(3*s)} ${r2(-1*s)} q${r2(1*s)} ${r2(-1*s)} ${r2(3*s)} ${r2(1*s)} q${r2(2*s)} ${r2(-2*s)} ${r2(5*s)} 0 q${r2(-1*s)} ${r2(-3*s)} ${r2(2*s)} ${r2(-5*s)} q${r2(-6*s)} ${r2(-2*s)} ${r2(-10*s)} ${r2(2*s)}Z" fill="${f}"${st?` stroke="${st}" stroke-width=".8"`:''}/>`);

    for(let i=0;i<36;i++)o.push(`<circle cx="${r2(x+S.f()*w)}" cy="${r2(top+S.f()*band*1.4)}" r="${r2(.7+S.f()*1.3)}" fill="#f3e9c9"/>`);

      o.push(`<path d="M${r2(a)} ${r2(b-s)} Q${r2(a)} ${r2(b)} ${r2(a+s)} ${r2(b)} Q${r2(a)} ${r2(b)} ${r2(a)} ${r2(b+s)} Q${r2(a)} ${r2(b)} ${r2(a-s)} ${r2(b)} Q${r2(a)} ${r2(b)} ${r2(a)} ${r2(b-s)}Z" fill="#f3e9c9"/>`)}
    const mx=x+w*(.12+S.f()*.14),my=top+band*.35,r=19;
    o.push(`<path d="M${r2(mx)} ${r2(my-r)} A${r} ${r} 0 1 0 ${r2(mx)} ${r2(my+r)} A${r2(r*.68)} ${r} 0 1 1 ${r2(mx)} ${r2(my-r)}Z" fill="#f3e9c9"/>`);
    if(spooky)for(let i=0;i<4;i++)bat(mx+24+S.f()*w*.35,my-10+S.f()*band*.7,.8+S.f()*.6,'#07090f','#f3e9c9');
  }else{

      if(spooky)bat(a,b,s,INK);
      else o.push(`<path d="M${r2(a-7*s)} ${r2(b-2*s)} Q${r2(a-3*s)} ${r2(b-5*s)} ${r2(a)} ${r2(b)} Q${r2(a+3*s)} ${r2(b-5*s)} ${r2(a+7*s)} ${r2(b-2*s)}" fill="none" class="d"/>`)}

function render(m,mode,palKey,opt){

  let i=0;

    const base=e.ci<0?pal.st:pal.c[e.ci];
    const F=fill?{top:mix(base,'#ffffff',.28),left:base,right:mix(base,'#000000',.24),win:pal.win,lit:pal.lit,acc:pal.flag,leaf:pal.leaf||mix(pal.c[1],'#3c7a4a',.55)}:{top:Wt,left:Wt,right:Wt,win:Wt,acc:Wt,leaf:Wt};
    C.o.push(`<g class="e" style="--i:${i++}">`);

    else if(e.kind==='bridge')drawBridge(e,F);

  const bg=fill?pal.paper:'#ffffff',sky=opt.sky?skyLayer(m.seed,x,y,w,h,night,opt.spooky):'';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${r2(x)} ${r2(y)} ${r2(w)} ${r2(h)}" preserveAspectRatio="xMidYMid meet"${ink?` style="--ink:${ink}"`:''}>`+
    `<style>.s,.d,.k{stroke:${INK};stroke-linejoin:round;stroke-linecap:round}.s{stroke-width:2.2}.d{stroke-width:1.1}.k{stroke-width:.055}</style>`+
    `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}" fill="${bg}"/>`+sky+C.o.join('')+`</svg>`;
  return{svg,w,h,ink:ink||'#1c1a17',paper:bg};
}

/* ---------- page ---------- */
function dailySeed(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const lum=h=>{const v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);return .2126*v[0]+.7152*v[1]+.0722*v[2]};
function initUI(){
  const $=id=>document.getElementById(id);
  const S={seed:'',daily:false,mode:'line',pal:'Quiet Pixel',height:.5,chaos:.35,cats:true,sky:true,night:false,spooky:false,lang:'en',model:null,out:null,pix:null,tok:0};
  const today=new Date(),dseed=dailySeed(today),dlabel=`daily, ${MON[today.getMonth()]} ${today.getDate()}`;
  S.spooky=(today.getMonth()===9&&today.getDate()>=20)||(today.getMonth()===10&&today.getDate()===1);
  const okSeed=s=>typeof s==='string'&&/^[A-Za-z0-9-]{1,32}$/.test(s);
  for(const k of Object.keys(PAL)){const o=document.createElement('option');o.value=o.textContent=k;$('pal').appendChild(o)}
  let dl=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(x=>{dl=x}).catch(()=>{})}catch(e){}
  let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)};
  const press=(id,v)=>$(id).setAttribute('aria-pressed',v);

  function rasterOut(out,long){return new Promise((res,rej)=>{
    const{w,h,ink}=out,k=long/Math.max(w,h),cw=Math.round(w*k),ch=Math.round(h*k);
    const src=out.svg.split(INK).join(ink).replace(/ style="--ink:[^"]*"/,'').replace('<svg ',`<svg width="${cw}" height="${ch}" `);
    const img=new Image(),url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml'}));
    img.onload=()=>{const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const g=cv.getContext('2d');
      g.fillStyle=out.paper;g.fillRect(0,0,cw,ch);g.drawImage(img,0,0,cw,ch);URL.revokeObjectURL(url);res(cv)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;})}
  // pixel mode: render 3x, then each 3x3 block becomes one pixel snapped to the palette; ink wins if it touches the block
  async function pixelate(out){
    const N=210,sub=3,cv=await rasterOut(out,N*sub),W=cv.width,H=cv.height,d=cv.getContext('2d').getImageData(0,0,W,H).data;
    const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
    const cols=[...new Set((out.svg.match(/#[0-9a-f]{6}/gi)||[]).map(c=>c.toLowerCase()))].map(hx),ink=hx(out.ink);
    const thr=Math.min(4200,...cols.map(c=>(c[0]-ink[0])**2+(c[1]-ink[1])**2+(c[2]-ink[2])**2).filter(v=>v>0).map(v=>v/4));
    const pw=Math.floor(W/sub),ph=Math.floor(H/sub),pc=document.createElement('canvas');pc.width=pw;pc.height=ph;
    const pg=pc.getContext('2d'),id=pg.createImageData(pw,ph),q=id.data,dist=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
    for(let py=0;py<ph;py++)for(let px=0;px<pw;px++){
      let ni=0,acc=[0,0,0],na=0;
      for(let j=0;j<sub;j++)for(let i=0;i<sub;i++){const o=((py*sub+j)*W+px*sub+i)*4,c=[d[o],d[o+1],d[o+2]];
        if(dist(c,ink)<thr)ni++;else{acc[0]+=c[0];acc[1]+=c[1];acc[2]+=c[2];na++}}

  }
  function upscale(src,long){const k=Math.max(1,Math.round(long/Math.max(src.width,src.height))),c=document.createElement('canvas');
    c.width=src.width*k;c.height=src.height*k;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(src,0,0,c.width,c.height);return c}

  function chrome(){
    const pal=S.night&&S.mode!=='line'?nightOf(PAL[S.pal]):PAL[S.pal],paper=S.out.paper;
    let ink=S.mode!=='line'&&pal.ink?pal.ink:'#1c1a17';if(lum(paper)<.35&&lum(ink)<.5)ink='#ece6d6';
    const rs=document.documentElement.style;

  }
  async function draw(anim){
    const art=$('art'),tok=++S.tok;art.classList.remove('build');

  }
  function showName(){const n=towerName(S.seed);$('tname').textContent=n[S.lang];$('tname').lang=S.lang;
    $('lang').innerHTML=S.lang==='en'?'<b>EN</b> / fr':'en / <b>FR</b>'}
  function build(anim){

  function setSeed(s,daily){

  let raf=0;const regen=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{S.height=+$('height').value;S.chaos=+$('chaos').value;build()})};
  $('height').oninput=regen;$('chaos').oninput=regen;
  const setMode=m=>{S.mode=m;press('mLine',m==='line');press('mFill',m==='fill');press('mPix',m==='pixel');
    $('pal').disabled=m==='line';$('night').disabled=m==='line';$('svgx').disabled=m==='pixel';$('replay').disabled=m==='pixel';draw()};
  $('mLine').onclick=()=>setMode('line');$('mFill').onclick=()=>setMode('fill');$('mPix').onclick=()=>setMode('pixel');
  $('pal').onchange=e=>{S.pal=e.target.value;draw()};
  $('cats').onclick=()=>{S.cats=!S.cats;press('cats',S.cats);draw()};
  $('sky').onclick=()=>{S.sky=!S.sky;press('sky',S.sky);draw()};

  $('spooky').onclick=()=>{S.spooky=!S.spooky;press('spooky',S.spooky);build()};
  press('spooky',S.spooky);
  // recent towers, kept in this browser only
  const RK='isoline.recent';
  const recent=()=>{try{const v=JSON.parse(localStorage.getItem(RK)||'[]');return Array.isArray(v)?v.filter(okSeed):[]}catch(e){return[]}};
  function remember(seed){const l=[seed,...recent().filter(x=>x!==seed)].slice(0,12);try{localStorage.setItem(RK,JSON.stringify(l))}catch(e){}if(!$('recent').hidden)strip()}
  function strip(){const box=$('recent');box.innerHTML='';const l=recent();if(!l.includes(S.seed))l.unshift(S.seed);
    for(const sd of l){const b=document.createElement('button');b.className=sd===S.seed?'cur':'';b.title=towerName(sd)[S.lang];
      b.innerHTML=render(generate(sd,S.height,S.chaos),'line','Quiet Pixel',{cats:false}).svg;
      const t=document.createElement('span');t.textContent=sd===dseed?'daily':sd;b.appendChild(t);
      b.onclick=()=>setSeed(sd,sd===dseed);box.appendChild(b)}}
  $('recentBtn').onclick=()=>{const box=$('recent');box.hidden=!box.hidden;press('recentBtn',!box.hidden);if(!box.hidden)strip()};
  // tap a cat to meet them

    fr:[['Cali','La Princesse','Règne sur le rez-de-chaussée.'],['Neo','Le Câlineur','Sieste en cours. Ne pas déranger.'],['Ramses',"L'Aventurier",'Enquête sur tout.'],['Diego','Le Loyal',"Miaule jusqu'à ce qu'on le remarque."]]};
  let bt;$('art').addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('[data-cat]'),bb=$('bubble');

    bb.innerHTML='';const n=document.createElement('b');n.textContent=c[0]+', '+c[1];const q=document.createElement('span');q.textContent=c[2];bb.append(n,q);

  async function save(name,blob){
    if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name)}catch(e){toast(e&&e.code==='declined'?'Save cancelled':'Saving is not available in this view')}return}

  $('png').onclick=()=>towerCanvas(3000).then(cv=>toPng(cv,`isoline-${S.seed}-${suffix()}.png`),()=>toast('PNG export failed, try SVG'));
  // framed sheets: Instagram 4:5 post and a US Letter colouring page at 300 dpi
  async function sheet(W,H,kind){
    const k=W/1080;let tw;try{tw=await towerCanvas(Math.round(1600*k))}catch(e){toast('Export failed');return}
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d'),ink=S.mode==='line'?'#1c1a17':getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||S.out.ink;
    g.fillStyle=S.out.paper;g.fillRect(0,0,W,H);g.imageSmoothingEnabled=S.mode!=='pixel';
    g.strokeStyle=ink;g.lineWidth=2*k;g.strokeRect(44*k,44*k,W-88*k,H-88*k);
    const bx=90*k,by=100*k,bw=W-180*k,bh=H-400*k,s=Math.min(bw/tw.width,bh/tw.height),dw=tw.width*s,dh=tw.height*s;
    g.drawImage(tw,bx+(bw-dw)/2,by+(bh-dh)/2,dw,dh);
    try{await document.fonts.load('700 40px "Space Mono"');await document.fonts.load('400 18px "Space Mono"')}catch(e){}
    g.fillStyle=ink;g.textAlign='center';
    const name=$('tname').textContent;let fs=42*k;do{g.font=`700 ${fs}px "Space Mono", monospace`;fs-=2*k}while(g.measureText(name).width>W-200*k&&fs>20*k);
    g.fillText(name,W/2,H-190*k);
    g.beginPath();g.moveTo(W/2-60*k,H-160*k);g.lineTo(W/2+60*k,H-160*k);g.lineWidth=1.5*k;g.stroke();
    g.font=`400 ${18*k}px "Space Mono", monospace`;try{g.letterSpacing=3*k+'px'}catch(e){}
    g.fillText(('ISO LINE TOWERS  /  '+(S.daily?dlabel:'seed '+S.seed)).toUpperCase(),W/2,H-118*k);
    toPng(cv,`isoline-${S.seed}-${kind}.png`);
  }
  $('post').onclick=()=>sheet(1080,1350,'post');
  $('page').onclick=()=>sheet(2550,3300,'page');
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('input,select,button,textarea')){e.preventDefault();fresh()}});
  window.addEventListener('hashchange',()=>{const s=readSeed();if(s&&s!==S.seed){S.seed=s;S.daily=s===dseed;build()}});
  const s0=readSeed();if(s0)setSeed(s0,s0===dseed);else setSeed(dseed,true);
}
if(typeof document!=='undefined')initUI();
