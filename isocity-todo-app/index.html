                width={size}

                stroke="currentColor"

            X: (p) => <IconBase {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>,

            EyeOff: (p) => <IconBase {...p}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7c.44 0 .87-.03 1.28-.08"/><line x1="2" x2="22" y1="2" y2="22"/></IconBase>,

        const {

        // --- CONFIGURATION & PALETTES ---

        const MATERIALS = {

        const THEMES = {

            TROPICAL: {

            },
            SWAMP: { 
                label: 'Haunted Swamp', type: 'NATURE', floor: 'grass_dead', liquid: 'water_murky', 
                wall: 'timber', foliage: 'leaves_dead', peak: 'stone', waterFreq: 0.6, bg: ['#365314', '#1a2e05'],
                hero: { wall: 'stone', roof: 'rust', detail: 'neon_green' }
            },
            VOLCANIC: {

                wall: 'obsidian', foliage: 'grass_dead', peak: 'stone', waterFreq: 0.3, bg: ['#450a0a', '#7f1d1d'],

            },
            DESERT: { 
                label: 'Painted Desert', type: 'NATURE', floor: 'sand', liquid: 'water', 
                wall: 'sand_red', foliage: 'cactus', peak: 'sand_red', waterFreq: 0.1, bg: ['#06b6d4', '#fdba74'],
                hero: { wall: 'sand_red', roof: 'white_wall', detail: 'gold' }
            },
        };

        const CATEGORIES = {
            WORK: { label: 'Work', color: 'blue', beacon: 'beacon_blue', icon: <Briefcase size={14} />, bg: 'bg-blue-500' },
            PERSONAL: { label: 'Personal', color: 'orange', beacon: 'beacon_orange', icon: <Heart size={14} />, bg: 'bg-orange-500' },
            HOUSE: { label: 'House', color: 'green', beacon: 'beacon_green', icon: <Home size={14} />, bg: 'bg-green-500' },
            SHOPPING: { label: 'Shopping', color: 'purple', beacon: 'beacon_purple', icon: <ShoppingBag size={14} />, bg: 'bg-purple-500' },
        };

        const GRID_SIZE = 12;
        const TILE_W = 84;
        const TILE_H = 42;
        const BLOCK_D = 28;

        // --- UTILS ---
        const noise = (x, y, seed) => {
            const s = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
            return s - Math.floor(s);
        };

        const seededRandom = (seed) => {
            const m = 0x80000000;
            const a = 1103515245;
            const c = 12345;
            let state = seed ? Math.floor(seed * m) : Math.floor(Math.random() * m);
            return () => {
                state = (a * state + c) % m;
                return state / (m - 1);
            };
        };

        const copyToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Failed to copy', err);
            }
            document.body.removeChild(textArea);
        };

        const App = () => {
            const [world, setWorld] = useState({});
            const [taskMap, setTaskMap] = useState({});
            const [seed, setSeed] = useState(Math.random());
            const [themeKey, setThemeKey] = useState('MEDITERRANEAN');
            const [isThemeLocked, setIsThemeLocked] = useState(false);
            const [isFocusMode, setIsFocusMode] = useState(false);
            const [hoveredTask, setHoveredTask] = useState(null);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [zoom, setZoom] = useState(1.0);
            const [showDataView, setShowDataView] = useState(false);
            const [showThemeMenu, setShowThemeMenu] = useState(false);
            
            const [canvasSize, setCanvasSize] = useState({ w: 800, h: 600 });
            const containerRef = useRef(null);
            const canvasRef = useRef(null);

            const [tasks, setTasks] = useState(() => {
                try {
                    const savedTasks = localStorage.getItem('iso-tasks');
                    return savedTasks ? JSON.parse(savedTasks) : [];
                } catch (e) {
                    console.error("Failed to load tasks", e);
                    return [];
                }
            });
            
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const [newTaskCategory, setNewTaskCategory] = useState('WORK');

            useEffect(() => {
                localStorage.setItem('iso-tasks', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                const updateSize = () => {
                    if (containerRef.current) {
                        setCanvasSize({
                            w: containerRef.current.clientWidth,
                            h: containerRef.current.clientHeight
                        });
                    }
                };
                window.addEventListener('resize', updateSize);
                updateSize(); 
                return () => window.removeEventListener('resize', updateSize);
            }, []);

            const handleReroll = () => {
                setSeed(Math.random());
                if (!isThemeLocked) {
                    const keys = Object.keys(THEMES);
                    const randomKey = keys[Math.floor(Math.random() * keys.length)];
                    setThemeKey(randomKey);
                }
            };

            const generateWorld = useCallback(() => {
                const newWorld = {};
                const newTaskMap = {};
                const center = GRID_SIZE / 2;
                const scene = THEMES[themeKey];

                const buildableSpots = [];
                
                // 1. Terrain Generation
                for (let x = 0; x < GRID_SIZE; x++) {
                    for (let y = 0; y < GRID_SIZE; y++) {
                        const key = `${x},${y}`;
                        const nHeight = noise(x, y, seed); 
                        const nFeature = noise(x, y, seed + 100);
                        
                        let stack = ['bedrock']; 
                        let isBuildable = false;

                        if (scene.type === 'CITY') {
                            let elevation = Math.floor(nHeight * scene.elevation);
                            if (themeKey === 'MARS_COLONY' || themeKey === 'UNDERGROUND') elevation = 0; 
                            
                            for(let i=0; i<=elevation; i++) stack.push(scene.floor); 

                            const isRoad = (x % 3 === 0 || y % 3 === 0);
                            
                            if (isRoad) {
                                stack[stack.length-1] = scene.road; 
                                if ((x%3===0 && y%2===0) || (y%3===0 && x%2===0)) {
                                    if (nFeature > 0.3) {
                                        const decor = scene.decor[Math.floor(Math.abs(nFeature*10)) % scene.decor.length];
                                        stack.push(decor);
                                    }
                                }
                            } else {
                                isBuildable = true;
                            }

                        } else {
                            const ridge = Math.abs(nHeight); 
                            const isMountain = ridge > 0.6;
                            const lakeNoise = Math.sin(x*0.8 + seed) * Math.cos(y*0.8 + seed*0.5);
                            const isWater = lakeNoise > (1.0 - scene.waterFreq); 

                            if (isWater) {
                                stack.push(scene.liquid);
                            } else if (isMountain) {
                                const h = Math.floor(ridge * 5);
                                for(let i=0; i<h; i++) stack.push(scene.peak === 'snow' ? 'stone' : scene.peak);
                                if (h > 2 && scene.peak === 'snow') stack.push('snow');
                            } else {
                                stack.push(scene.floor);
                                if (nFeature > 0.4) {
                                    stack.push('timber');
                                    stack.push(scene.foliage);
                                    if (nFeature > 0.8) stack.push(scene.foliage); 
                                } else if (nFeature < 0.2) {
                                    if (themeKey === 'SWAMP') stack.push('leaves_dead');
                                    else if (themeKey === 'VOLCANIC') stack.push('obsidian'); 
                                    else stack.push('leaves');
                                }
                                isBuildable = true;
                            }
                        }

                        newWorld[key] = stack;
                        if (isBuildable) buildableSpots.push({ x, y, key, nHeight, nFeature });
                    }
                }

                // Shuffle Spots
                const rng = seededRandom(seed);
                for (let i = buildableSpots.length - 1; i > 0; i--) {
                    const j = Math.floor(rng() * (i + 1));
                    [buildableSpots[i], buildableSpots[j]] = [buildableSpots[j], buildableSpots[i]];
                }

                const activeTasks = tasks.filter(t => !t.completed);
                const placedCoords = [];
                const MIN_DIST = 2; 

                activeTasks.forEach((task, index) => {
                    let bestSpotIdx = -1;
                    for(let i=0; i < buildableSpots.length; i++) {
                        const spot = buildableSpots[i];
                        const tooClose = placedCoords.some(p => Math.abs(p.x - spot.x) + Math.abs(p.y - spot.y) < MIN_DIST);
                        if (!tooClose) {
                            bestSpotIdx = i;
                            break;
                        }
                    }
                    
                    if (bestSpotIdx === -1) bestSpotIdx = 0; 
                    if (bestSpotIdx >= buildableSpots.length) return; 

                    const spot = buildableSpots.splice(bestSpotIdx, 1)[0];
                    placedCoords.push({x: spot.x, y: spot.y});
                    
                    newTaskMap[spot.key] = { taskId: task.id, stackHeight: 0 }; 

                    const stack = [...newWorld[spot.key]];
                    const cat = CATEGORIES[task.category];
                    const h = 5 + (task.id % 3); 
                    const heroStyle = scene.hero;
                    
                    if (stack[stack.length-1] !== 'concrete') stack.push('concrete'); 

                    for(let i=0; i<h; i++) stack.push(heroStyle.wall);
                    stack.push(heroStyle.roof);
                    stack.push(cat.beacon);
                    
                    newWorld[spot.key] = stack;
                    newTaskMap[spot.key].stackHeight = stack.length;
                });

                tasks.filter(t => t.completed).forEach((task, index) => {
                    if (index < buildableSpots.length) {
                        const spot = buildableSpots.shift();
                        const stack = [...newWorld[spot.key]];
                        if (scene.type === 'CITY') {
                            if (stack[stack.length-1] === 'concrete') stack[stack.length-1] = 'grass';
                            stack.push('leaves'); 
                        } else {
                            stack.push('stone', 'lamp_yellow'); 
                        }
                        newWorld[spot.key] = stack;
                    }
                });

                if (scene.type === 'CITY') {
                    buildableSpots.forEach(spot => {
                        const stack = [...newWorld[spot.key]];
                        if (spot.nFeature > 0.4) {
                            const mat = scene.wall[(Math.floor(spot.nFeature * 10)) % scene.wall.length];
                            const h = 1 + (Math.floor(spot.nHeight * 10) % 2); 
                            for(let i=0; i<h; i++) stack.push(mat);
                            stack.push(scene.roof); 
                        }
                        newWorld[spot.key] = stack;
                    });
                }

                setWorld(newWorld);
                setTaskMap(newTaskMap);
            }, [seed, tasks, themeKey]); 

            useEffect(() => { generateWorld(); }, [generateWorld]);

            // --- RENDERING ---

            const drawBlock = (ctx, x, y, type, zIndex, currentZoom, isTaskBlock, isFocusMode) => {
                if (!MATERIALS[type]) return; 
                const mat = MATERIALS[type];
                const [top, left, right] = mat.c;
                
                let fillTop = top, fillLeft = left, fillRight = right;
                
                if (isFocusMode && !isTaskBlock && type !== 'bedrock') {
                    ctx.globalAlpha = 0.2; 
                } else {
                    ctx.globalAlpha = 1.0;
                }

                const TW = TILE_W * currentZoom;
                const TH = TILE_H * currentZoom;
                const BD = BLOCK_D * currentZoom;

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + TW / 2, y + TH / 2);
                ctx.lineTo(x, y + TH);
                ctx.lineTo(x - TW / 2, y + TH / 2);
                ctx.fillStyle = fillTop;
                ctx.fill();
                
                ctx.fillStyle = fillLeft;
                ctx.beginPath();
                ctx.moveTo(x - TW / 2, y + TH / 2);
                ctx.lineTo(x, y + TH);
                ctx.lineTo(x, y + TH + BD);
                ctx.lineTo(x - TW / 2, y + TH / 2 + BD);
                ctx.fill();

                ctx.fillStyle = fillRight;
                ctx.beginPath();
                ctx.moveTo(x + TW / 2, y + TH / 2);
                ctx.lineTo(x, y + TH);
                ctx.lineTo(x, y + TH + BD);
                ctx.lineTo(x + TW / 2, y + TH / 2 + BD);
                ctx.fill();

                ctx.globalAlpha = 1.0; 

                if (!isFocusMode || isTaskBlock) {
                    const isWall = ['glass', 'glass_dark', 'concrete', 'white_wall', 'brick_red', 'brick_brown', 'steel', 'tile_white'].includes(type);
                    if (isWall && zIndex > 1) { 
                        const hasWindow = (Math.sin(x * 12 + y * 23 + zIndex * 34) > 0.3); 
                        if (hasWindow) {
                            let winColor = '#475569'; 
                            if (themeKey === 'UNDERGROUND') winColor = '#a3e635'; 
                            else if (themeKey === 'NEO_TOKYO') winColor = '#e879f9';
                            else if (mat.glass) winColor = '#bae6fd'; 
                            
                            ctx.fillStyle = winColor;
                            ctx.fillRect(x + TW/4, y + TH/1.5 + BD/4, TW/6, BD/3);
                            ctx.fillRect(x - TW/2.5, y + TH/1.5 + BD/4, TW/6, BD/3);
                        }
                    }

                    if (mat.emit) {
                        const cx = x;
                        const cy = y + TH/2;
                        const grad = ctx.createRadialGradient(cx, cy, TW/10, cx, cy, TW);
                        grad.addColorStop(0, mat.emit);
                        grad.addColorStop(1, 'rgba(0,0,0,0)');
                        
                        ctx.globalCompositeOperation = 'screen'; 
                        ctx.fillStyle = grad;
                        ctx.globalAlpha = 0.6;
                        ctx.fillRect(x - TW, y - TH, TW*2, TH*3);
                        ctx.globalAlpha = 1.0;
                        ctx.globalCompositeOperation = 'source-over'; 
                    }
                }
            };

            const renderScene = (ctx, width, height) => {
                ctx.clearRect(0, 0, width, height);

                const grad = ctx.createLinearGradient(0, 0, 0, height);
                const bg = THEMES[themeKey].bg || ['#000', '#333'];

                grad.addColorStop(0, bg[0]);
                grad.addColorStop(1, bg[1]);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
                
                const originX = width / 2;
                const originY = height / 2.5; // Adjusted to push scene up

                const keys = Object.keys(world).sort((a, b) => {
                    const [ax, ay] = a.split(',').map(Number);
                    const [bx, by] = b.split(',').map(Number);
                    return (ax + ay) - (bx + by);
                });

                keys.forEach(key => {
                    const [x, y] = key.split(',').map(Number);
                    const stack = world[key];
                    const isTaskBlock = taskMap[key] !== undefined;

                    stack.forEach((type, z) => {
                        const TW = TILE_W * zoom;
                        const TH = TILE_H * zoom;
                        const BD = BLOCK_D * zoom;
                        
                        const screenX = originX + (x - y) * (TW / 2);
                        const screenY = originY + (x + y) * (TH / 2) - (z * BD);
                        
                        drawBlock(ctx, screenX, screenY, type, z, zoom, isTaskBlock, isFocusMode);
                    });
                });
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (canvas) {
                    renderScene(canvas.getContext('2d'), canvas.width, canvas.height);
                }
            }, [world, themeKey, zoom, canvasSize, isFocusMode]); 

            const handleMouseMove = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                
                const TW = TILE_W * zoom;
                const TH = TILE_H * zoom;
                const BD = BLOCK_D * zoom;
                
                const originX = canvas.width / 2;
                const originY = canvas.height / 2.5; 
                
                let bestMatch = null;

                Object.entries(taskMap).forEach(([key, info]) => {
                    const [gx, gy] = key.split(',').map(Number);
                    const task = tasks.find(t => t.id === info.taskId);
                    if (!task) return;

                    const screenX = originX + (gx - gy) * (TW / 2);
                    const baseY = originY + (gx + gy) * (TH / 2);
                    const topY = baseY - (info.stackHeight * BD);

                    const dx = Math.abs(mx - screenX);
                    
                    if (dx < TW / 2) {
                        if (my >= topY && my <= baseY + TH) {
                            bestMatch = task;
                        }
                    }
                });

                setHoveredTask(bestMatch);
                setMousePos({ x: e.clientX, y: e.clientY });
            };

            const addTask = () => {
                if(!newTaskTitle.trim()) return;
                const nt = { id: Date.now(), title: newTaskTitle, category: newTaskCategory, completed: false };
                setTasks([...tasks, nt]);
                setNewTaskTitle('');
            };
            const toggleTask = (id) => setTasks(tasks.map(t => t.id===id ? {...t, completed: !t.completed} : t));
            const deleteTask = (id) => setTasks(tasks.filter(t => t.id!==id));

            return (
                <div className="relative min-h-screen font-sans bg-black overflow-hidden flex flex-col" ref={containerRef}>
                    <div className="absolute inset-0 z-0">
                        <canvas 
                            ref={canvasRef} 
                            width={canvasSize.w} 
                            height={canvasSize.h} 
                            className="block"
                            onMouseMove={handleMouseMove} 
                        />
                    </div>

                    <div className="relative z-10 flex items-center justify-between px-8 py-6 pointer-events-none">
                        <div className="flex flex-col drop-shadow-lg">
                            <h1 className="text-white font-black text-4xl tracking-tight leading-none">{THEMES[themeKey].label}</h1>
                            <span className="text-white/80 text-xs font-bold uppercase tracking-widest mt-1 flex items-center gap-2">
                                <Globe2 size={12} /> {THEMES[themeKey].type} • {tasks.filter(t => !t.completed).length} Tasks
                            </span>
                        </div>
                        <div className="pointer-events-auto flex gap-3">
                            <div className="relative">
                                <button 
                                    onClick={() => setShowThemeMenu(!showThemeMenu)}
                                    className="flex items-center gap-3 bg-black/40 backdrop-blur-md rounded-2xl p-2 pl-4 border border-white/10 hover:bg-black/60 transition-all text-white"
                                >
                                    <span className="text-xs font-bold uppercase tracking-wide">{THEMES[themeKey].label}</span>
                                    <ChevronDown size={16} />
                                </button>
                                
                                {showThemeMenu && (
                                    <div className="absolute right-0 top-full mt-2 w-56 bg-black/90 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl overflow-hidden max-h-80 overflow-y-auto custom-scrollbar">
                                        {Object.keys(THEMES).map(k => (
                                            <button 
                                                key={k}
                                                onClick={() => { setThemeKey(k); if(!isThemeLocked) setSeed(Math.random()); setShowThemeMenu(false); }}
                                                className={`w-full text-left px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-white/10 transition-colors ${themeKey === k ? 'text-white bg-white/5' : 'text-white/50'}`}
                                            >
                                                {THEMES[k].label}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <button onClick={() => setIsThemeLocked(!isThemeLocked)} className={`p-3 rounded-2xl border border-white/10 backdrop-blur-md transition-all ${isThemeLocked ? 'bg-orange-500/20 text-orange-400' : 'bg-black/40 text-white/50 hover:text-white'}`}>
                                {isThemeLocked ? <Lock size={20} /> : <Unlock size={20} />}
                            </button>
                            
                            <button onClick={() => setIsFocusMode(!isFocusMode)} className={`p-3 rounded-2xl border border-white/10 backdrop-blur-md transition-all ${isFocusMode ? 'bg-indigo-500 text-white' : 'bg-black/40 text-white/50 hover:text-white'}`} title="Focus Mode">
                                {isFocusMode ? <Eye size={20} /> : <EyeOff size={20} />}
                            </button>

                            <button onClick={() => setShowDataView(!showDataView)} className={`p-3 rounded-2xl border border-white/10 backdrop-blur-md transition-all ${showDataView ? 'bg-white text-black' : 'bg-black/40 text-white hover:bg-black/50'}`}>
                                <QrCode size={20} />
                            </button>
                        </div>
                    </div>

                    {hoveredTask && (
                        <div className="fixed z-50 pointer-events-none flex flex-col items-center gap-2 transform -translate-y-full -translate-x-1/2 -mt-4 transition-all duration-300 ease-out"
                            style={{ top: mousePos.y, left: mousePos.x }}>
                            <div className="bg-white/90 backdrop-blur-xl shadow-2xl rounded-2xl p-4 border border-white/50 flex items-center gap-3 animate-in fade-in zoom-in-95 duration-200">
                                <span className={`w-3 h-3 rounded-full ${CATEGORIES[hoveredTask.category].bg}`} />
                                <div>
                                    <div className="text-sm font-black text-slate-900 leading-none">{hoveredTask.title}</div>
                                    <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mt-1">{hoveredTask.category} Building</div>
                                </div>
                            </div>
                            <div className="w-0.5 h-8 bg-white/50" />
                        </div>
                    )}

                    <div className="absolute inset-0 z-10 pointer-events-none flex flex-col justify-end p-8">
                        
                        <div className="flex items-end justify-between w-full pointer-events-auto">
                            
                            <div className="w-80 bg-black/40 backdrop-blur-xl border border-white/10 rounded-3xl p-4 flex flex-col gap-4 shadow-2xl transition-all hover:bg-black/60">
                                <div className="flex gap-2">
                                    <input 
                                        className="flex-1 bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:bg-white/20 font-medium placeholder:text-white/30"
                                        placeholder="New task..." 
                                        value={newTaskTitle} 
                                        onChange={(e) => setNewTaskTitle(e.target.value)} 
                                        onKeyDown={(e) => e.key === 'Enter' && addTask()}
                                    />
                                    <button onClick={addTask} className="bg-white text-black rounded-xl px-4 hover:scale-105 active:scale-95 transition-all flex items-center justify-center">
                                        <Plus size={20} />
                                    </button>
                                </div>
                                
                                <div className="flex gap-2">
                                    {Object.entries(CATEGORIES).map(([k, cat]) => (
                                        <button 
                                            key={k} 
                                            onClick={() => setNewTaskCategory(k)}
                                            className={`flex-1 h-1.5 rounded-full transition-all ${newTaskCategory === k ? `${cat.bg} scale-110 shadow-[0_0_10px_rgba(255,255,255,0.5)]` : 'bg-white/10 hover:bg-white/30'}`}
                                            title={cat.label}
                                        />
                                    ))}
                                </div>

                                <div className="max-h-32 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                                    {tasks.length === 0 && <div className="text-white/30 text-xs text-center py-2">Start adding tasks to build your city</div>}
                                    {tasks.map(task => (
                                        <div key={task.id} className="group flex items-center justify-between p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 transition-all">
                                            <div className="flex items-center gap-3 overflow-hidden">
                                                <button onClick={() => toggleTask(task.id)} className={`w-5 h-5 rounded-full border border-white/30 flex items-center justify-center ${task.completed ? 'bg-green-500 border-green-500' : 'hover:border-white'}`}>
                                                    {task.completed && <CheckCircle2 size={12} className="text-white" />}
                                                </button>
                                                <span className={`text-xs font-medium truncate ${task.completed ? 'text-white/30 line-through' : 'text-white'}`}>{task.title}</span>
                                            </div>
                                            <button onClick={() => deleteTask(task.id)} className="text-white/20 hover:text-red-400 transition-colors"><Trash2 size={14} /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex items-end gap-4">
                                <button 
                                    onClick={handleReroll} 
                                    className="group relative w-16 h-16 bg-white rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center justify-center"
                                    title="Reroll Scene"
                                >
                                    <Dice5 size={28} className="text-black group-hover:rotate-180 transition-transform duration-700 ease-out" />
                                </button>

                                <div className="bg-black/40 backdrop-blur-md rounded-2xl p-2 border border-white/10 flex flex-col gap-2">
                                    <button onClick={() => setZoom(z => Math.min(3.0, z + 0.2))} className="p-2 text-white hover:bg-white/20 rounded-xl transition-colors"><ZoomIn size={20} /></button>
                                    <div className="w-8 h-px bg-white/10 mx-auto" />
                                    <button onClick={() => setZoom(z => Math.max(0.5, z - 0.2))} className="p-2 text-white hover:bg-white/20 rounded-xl transition-colors"><ZoomOut size={20} /></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {showDataView && (
                        <div className="absolute inset-0 z-50 bg-slate-900/95 backdrop-blur-xl flex items-center justify-center p-8 animate-in fade-in duration-200">
                            <div className="w-full max-w-2xl bg-black border border-white/10 rounded-3xl p-8 shadow-2xl relative">
                                <button onClick={() => setShowDataView(false)} className="absolute top-6 right-6 text-white/50 hover:text-white">
                                    <X size={24} />
                                </button>
                                
                                <div className="flex items-center gap-4 mb-8">
                                    <div className="p-4 bg-white/10 rounded-2xl text-white">
                                        <QrCode size={32} />
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-bold text-white">Data View</h2>
                                        <p className="text-white/50 text-sm">Scan to export tasks</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-8">
                                    <div className="space-y-4">
                                        <label className="text-xs font-bold text-white/40 uppercase tracking-widest">Raw List</label>
                                        <div className="bg-white/5 rounded-xl p-4 font-mono text-xs text-white/80 h-64 overflow-y-auto select-all border border-white/5 custom-scrollbar">
                                            {tasks.map(t => `[${t.completed ? 'x' : ' '}] ${t.title} (${t.category})`).join('\n')}
                                        </div>
                                        <button 
                                            onClick={() => copyToClipboard(tasks.map(t => `[${t.completed ? 'x' : ' '}] ${t.title} (${t.category})`).join('\n'))}
                                            className="w-full py-3 bg-white text-black font-bold rounded-xl flex items-center justify-center gap-2 hover:bg-slate-200 transition-colors"
                                        >
                                            <Copy size={16} /> Copy to Clipboard
                                        </button>
                                    </div>
                                    <div className="flex flex-col items-center justify-center bg-white rounded-2xl p-4">
                                        <img 
                                            src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(tasks.map(t => `[${t.completed ? 'x' : ' '}] ${t.title}`).join('\n'))}`}
                                            alt="Task QR Code"
                                            className="w-48 h-48 mix-blend-multiply"
                                        />
                                        <p className="text-black/40 text-[10px] font-bold uppercase tracking-widest mt-6">Scan with Phone</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
